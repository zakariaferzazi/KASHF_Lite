name: kashf_lite
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Persisted UI prefs (e.g., the user's language selection).
  shared_preferences: ^2.3.0
  syncfusion_flutter_charts: ^27.2.5

  # Firebase backend (connected via FlutterFire CLI).
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  # Firestore-backed persistence for completed investigations. The
  # `FirestoreInvestigationWriter` writes one document per run under
  # `users/{uid}/investigations/{docId}` so each signed-in user keeps
  # their own private archive. The local SharedPreferences writer
  # stays in the loop as a write-through cache so the home screen
  # never blocks on the network.
  cloud_firestore: ^5.4.4

  # OpenRouter AI integration. We use the built-in `http` client
  # (already shipped with Flutter) plus `flutter_dotenv` to source the
  # API key from a .env file at runtime. No extra native deps.
  http: ^1.2.2
  flutter_dotenv: ^5.2.1

  # In-app article reader used by the Explore screen's trending
  # news carousel. Tapping a card opens a bottom-sheet WebView.
  webview_flutter: ^4.10.0

  # Evidence upload — real file picking for the investigation flow.
  file_picker: ^8.1.6
  uuid: ^4.5.1

  # Used by the Settings → Contact Support and Feedback flows to
  # hand the user off to the device's mail client with a pre-filled
  # message addressed to the support inbox.
  url_launcher: ^6.3.1

  # Used by the Settings → About screen to render the running
  # version + build number pulled from the native bundle.
  package_info_plus: ^8.0.2

  # Used by the Welcome / Sign-in / Sign-up screens for the
  # "Continue with Apple" button. On iOS/macOS it returns a real
  # Apple credential; on every other platform it throws
  # `SignInWithAppleNotSupportedException`, which the auth
  # service catches and surfaces as a friendly snackbar instead
  # of silently dropping the user into the home screen.
  sign_in_with_apple: ^6.1.4
  flutter_launcher_icons: ^0.14.4

  # PDF generation. The `pdf` package renders text using
  # embedded TrueType fonts, which correctly handles Arabic
  # (and any Unicode script) without the font-encoding
  # bugs that plagued the old hand-rolled PDF writer.
  pdf: ^3.11.0

  # Pinned override: pdf 3.12.x ships with bidi 2.0.13 which
  # crashes with RangeError on Arabic text containing certain
  # combining-mark sequences. We pin to the same 2.0.13 line
  # and call `logicalToVisual2` ourselves from
  # `report_pdf_writer.dart` so we drive the bidi algorithm
  # directly and bypass the package's internal shaper, which
  # would otherwise re-reverse runs inside RTL paragraphs.
  bidi: 2.0.13

  # `pdf` package's TTF renderer only applies basic-to-isolated
  # Arabic substitution, so letters in our generated PDFs end up
  # rendered in their disconnected isolated forms. `arabic_reshaper`
  # performs the full Unicode Arabic shaping algorithm
  # (isolated / initial / medial / final) plus ligature merging
  # (Lam-Alef, etc.) — we run it on every Arabic-bearing string
  # before handing it to `pw.Text` so the embedded
  # `NotoSansArabic` font maps each codepoint to the right
  # contextual glyph.
  arabic_reshaper: ^0.0.1

  # Used by the Export-PDF bar to write the report into the
  # platform's standard Documents / Downloads folder.
  path_provider: ^2.1.3

  # Optional: enables the Android background task for the
  # auto-refresh scheduler. The current implementation uses
  # `services/workmanager_shim.dart` so the codebase compiles
  # without the package installed; the foreground Timer in
  # `AutoRefreshService` is the source of truth on iOS / desktop
  # and also works on Android. To enable the OS-level background
  # task, add `workmanager: ^0.5.2` here and re-run `flutter pub get`.
  # workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/
    - assets/fonts/
    - assets/Data/
    - .env
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
